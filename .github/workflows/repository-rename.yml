name: Rename repository to GH_ADDMIN_POVIDER

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/repository-rename.yml

permissions:
  contents: read
  id-token: write

jobs:
  rename:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      INFISICAL_IDENTITY_ID: b0962d69-bd33-4ac3-b4f4-48589535ca38
      INFISICAL_PROJECT_SLUG: ogenic-sio-ti-rv
      INFISICAL_SECRET_ENV_SLUG: staging
      INFISICAL_SECRET_PATH: /
      EXPECTED_OLD_REPOSITORY: Wave-Runner-2/codex-action
      TARGET_NAME: GH_ADDMIN_POVIDER
    steps:
      - uses: Infisical/secrets-action@v1.0.9
        with:
          method: oidc
          identity-id: ${{ env.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ env.INFISICAL_PROJECT_SLUG }}
          env-slug: ${{ env.INFISICAL_SECRET_ENV_SLUG }}
          secret-path: ${{ env.INFISICAL_SECRET_PATH }}
          recursive: true
          domain: https://app.infisical.com
          export-type: env
          include-imports: true
      - name: Rename repository and verify
        shell: bash
        run: |
          set -euo pipefail
          set +x
          test "$GITHUB_REPOSITORY" = "$EXPECTED_OLD_REPOSITORY" || {
            echo "::error::Unexpected source repository: $GITHUB_REPOSITORY"; exit 1;
          }
          test -n "${GIT_HUB_RUNNER_2:-}" || {
            echo "::error::GIT_HUB_RUNNER_2 missing"; exit 1;
          }
          curl --fail-with-body --silent --show-error             -X PATCH             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer ${GIT_HUB_RUNNER_2}"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${EXPECTED_OLD_REPOSITORY}"             -d '{"name":"GH_ADDMIN_POVIDER"}' > "$RUNNER_TEMP/renamed.json"
          python - "$RUNNER_TEMP/renamed.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1]))
          assert data["full_name"] == "Wave-Runner-2/GH_ADDMIN_POVIDER", data.get("full_name")
          print("REPOSITORY_RENAME=PASS")
          print("TARGET=Wave-Runner-2/GH_ADDMIN_POVIDER")
          PY
