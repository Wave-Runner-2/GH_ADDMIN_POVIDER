name: GH_ADDMIN_POVIDER private source mirror

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/private-source-mirror.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      INFISICAL_IDENTITY_ID: b0962d69-bd33-4ac3-b4f4-48589535ca38
      INFISICAL_PROJECT_SLUG: ogenic-sio-ti-rv
      INFISICAL_SECRET_ENV_SLUG: staging
      INFISICAL_SECRET_PATH: /
      SOURCE_REPOSITORY: Ogenicchocolate21debug/Build-Platform
      TARGET_REPOSITORY: Wave-Runner-2/Build-Platform
    steps:
      - uses: Infisical/secrets-action@v1.0.9
        with:
          method: oidc
          identity-id: ${{ env.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ env.INFISICAL_PROJECT_SLUG }}
          env-slug: ${{ env.INFISICAL_SECRET_ENV_SLUG }}
          secret-path: ${{ env.INFISICAL_SECRET_PATH }}
          recursive: true
          domain: https://app.infisical.com
          export-type: env
          include-imports: true
      - name: Create private target and mirror source
        shell: bash
        run: |
          set -euo pipefail
          set +x
          test -n "${GIT_HUB_RUNNER_2:-}" || { echo "::error::GIT_HUB_RUNNER_2 missing"; exit 1; }
          api() {
            curl --fail-with-body --silent --show-error               -H "Accept: application/vnd.github+json"               -H "Authorization: Bearer ${GIT_HUB_RUNNER_2}"               -H "X-GitHub-Api-Version: 2022-11-28"               "$@"
          }
          status="$(curl --silent --output "$RUNNER_TEMP/target.json" --write-out '%{http_code}'             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer ${GIT_HUB_RUNNER_2}"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${TARGET_REPOSITORY}")"
          if [ "$status" = 404 ]; then
            api -X POST https://api.github.com/user/repos               -d '{"name":"Build-Platform","private":true,"description":"GH_ADDMIN_POVIDER operational mirror"}'               > "$RUNNER_TEMP/created.json"
            echo "TARGET_CREATED=PASS"
          elif [ "$status" = 200 ]; then
            echo "TARGET_EXISTS=PASS"
          else
            echo "::error::Target repository preflight returned HTTP $status"; exit 1
          fi
          auth="$(printf 'x-access-token:%s' "$GIT_HUB_RUNNER_2" | base64 -w0)"
          git -c "http.extraHeader=Authorization: Basic $auth" clone --mirror             "https://github.com/${SOURCE_REPOSITORY}.git" "$RUNNER_TEMP/source.git"
          git -C "$RUNNER_TEMP/source.git"             -c "http.extraHeader=Authorization: Basic $auth" push --mirror             "https://github.com/${TARGET_REPOSITORY}.git"
          unset auth
          echo "PRIVATE_MIRROR=PASS"
